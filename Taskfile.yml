version: '3'
tasks:
  default: mix test
  sh: iex --erl "-kernel shell_history enabled" -S mix
  run: iex --erl "-kernel shell_history enabled" -S mix phx.server
  fmt: mix format

  db: psql authx_dev

  # demo
  demo.run: |
    cd demo
    # AUTHX_CLIENT_ID from OauthClient.id
    AUTHX_CLIENT_ID=01a1defe-d8bf-7311-84ca-0cfad058cc44 mix phx.server

  setup: |
    mix setup
